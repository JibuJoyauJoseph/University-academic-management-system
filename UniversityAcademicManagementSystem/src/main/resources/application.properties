spring.application.name=university-academic-management-system

# PostgreSQL connection. Override these values with environment variables as needed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/university_academic_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Create/update tables from the entity mappings during development.
# Change to 'validate' after the schema has been created and reviewed.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
